services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RTSP_URL: ${RTSP_URL:-}
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - swarm-data:/app/data
      - ./weights:/app/weights:ro
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  swarm-data:
